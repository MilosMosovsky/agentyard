name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: "agentyard stays lean: one stdlib-only binary, no build step. Ideas that fit that shape land fastest."
